<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Web de Gestión Académica</title>

    <style>
        body {
            margin: 0;
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;

        .caratula {
            width: 700px;
            min-height: 100vh;
            margin: auto;
            padding-top: 10px;
        }

        .logo {

            margin-bottom: 75px;

        .seccion {

        }

        .seccion h2 {

        .seccion p {
            font-size: 14px;
            margin: 0;
        }

        .integrantes {
            margin-top: 45px;
            margin-bottom: 80px;
        }

        .integrantes ul {
            width: 330px;
            margin: auto;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        .integrantes li {
            font-size: 14px;
            margin-bottom: 22px;
        }

        .integrantes li::before {

        }

        .anio {

        </div>

        <div class="seccion integrantes">
            <h2>Integrantes</h2>

            <ul>
                <li>Chorres Arroyo, Samir Duban</li>
                <li>Sanchez Pretell, Axel</li>
                <li>Rodriguez Velasquez, Julio</li>
